<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="InvestGuard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>InvestGuard</title>
  <style>
    .seg { fill: none; stroke-width: 6; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
    .s2 { animation-delay: .12s; }
    .s3 { animation-delay: .24s; }
    @keyframes grow { from { stroke-dasharray: 0 100; } }

    .line { fill: none; stroke: #f1f5f9; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .trend { stroke-dasharray: 100; animation: draw .9s .6s cubic-bezier(.4,0,.2,1) both; }
    @keyframes draw { from { stroke-dashoffset: 100; } }
    .head { animation: show .3s 1.35s ease-out both; }
    @keyframes show { from { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .seg, .trend, .head { animation: none; }
    }
  </style>

  <!-- pierścień alokacji portfela (3 segmenty) -->
  <g transform="rotate(-90 32 32)">
    <circle class="seg s1" cx="32" cy="32" r="22" pathLength="100" stroke="#60a5fa" stroke-dasharray="46 54" stroke-dashoffset="0"/>
    <circle class="seg s2" cx="32" cy="32" r="22" pathLength="100" stroke="#34d399" stroke-dasharray="28 72" stroke-dashoffset="-49"/>
    <circle class="seg s3" cx="32" cy="32" r="22" pathLength="100" stroke="#94a3b8" stroke-dasharray="17 83" stroke-dashoffset="-80"/>
  </g>

  <!-- linia wzrostu ze strzałką -->
  <path class="line trend" pathLength="100" d="M18 41 L25 34 L30 39 L45 24"/>
  <path class="line head" d="M37 24 H45 V32"/>
</svg>
