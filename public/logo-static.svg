<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="InvestGuard">
  <title>InvestGuard</title>
  <style>
    .seg { fill: none; stroke-width: 6; }
    .line { fill: none; stroke: #0f172a; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- pierścień alokacji portfela (3 segmenty) -->
  <g transform="rotate(-90 32 32)">
    <circle class="seg" cx="32" cy="32" r="22" pathLength="100" stroke="#3b82f6" stroke-dasharray="46 54" stroke-dashoffset="0" />
    <circle class="seg" cx="32" cy="32" r="22" pathLength="100" stroke="#10b981" stroke-dasharray="28 72" stroke-dashoffset="-49" />
    <circle class="seg" cx="32" cy="32" r="22" pathLength="100" stroke="#64748b" stroke-dasharray="17 83" stroke-dashoffset="-80" />
  </g>

  <!-- linia wzrostu ze strzałką -->
  <path class="line" pathLength="100" d="M18 41 L25 34 L30 39 L45 24" />
  <path class="line" d="M37 24 H45 V32" />
</svg>