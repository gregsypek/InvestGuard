<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .seg { fill: none; stroke-width: 6; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
    .s2 { animation-delay: .12s; }
    .s3 { animation-delay: .24s; }
    @keyframes grow { from { stroke-dasharray: 0 100; } }

    .line { fill: none; stroke: #0f172a; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 100; animation: draw .9s .6s cubic-bezier(.4,0,.2,1) both; }
    @keyframes draw { from { stroke-dashoffset: 100; } }

    .dot, .halo { fill: #10b981; transform-box: fill-box; transform-origin: center; }
    .dot { animation: pop .35s 1.4s cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes pop { from { transform: scale(0); } }
    .halo { opacity: 0; animation: ping 2.8s 2s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .5; } 70%, 100% { transform: scale(3.2); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .seg, .line, .dot, .halo { animation: none; }
    }
  </style>

  <!-- pierścień alokacji portfela (3 segmenty) -->
  <g transform="rotate(-90 32 32)">
    <circle class="seg s1" cx="32" cy="32" r="22" pathLength="100" stroke="#3b82f6" stroke-dasharray="46 54" stroke-dashoffset="0"/>
    <circle class="seg s2" cx="32" cy="32" r="22" pathLength="100" stroke="#10b981" stroke-dasharray="28 72" stroke-dashoffset="-49"/>
    <circle class="seg s3" cx="32" cy="32" r="22" pathLength="100" stroke="#94a3b8" stroke-dasharray="17 83" stroke-dashoffset="-80"/>
  </g>

  <!-- linia wzrostu + żywy punkt -->
  <path class="line" pathLength="100" d="M19 42 L26 35 L31 39 L44 23"/>
  <circle class="halo" cx="44" cy="23" r="3"/>
  <circle class="dot" cx="44" cy="23" r="3"/>
</svg>
